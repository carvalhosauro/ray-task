name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Ctrl+N
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ray-task version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: "Linux: ~/.local/state/ray-task/ray-task.log · macOS: ~/Library/Application Support/ray-task/ · Windows: %APPDATA%\\ray-task\\"
      render: text
