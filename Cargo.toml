[workspace]
resolver = "2"
members = ["crates/core", "crates/gus-list", "crates/gus-list-slint", "crates/gus-anim-state", "crates/gus-keys", "crates/gus-keys-slint", "crates/gus-combobox", "crates/app-slint"]

[workspace.package]
edition = "2021"
version = "0.1.2"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/carvalhosauro/ray-task"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
tracing = "0.1.44"
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
