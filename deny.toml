# cargo-deny policy. Docs: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Flag unmaintained crates only when they are our direct deps; transitive ones
# (e.g. ttf-parser via Slint, RUSTSEC-2026-0192) have no fix we can apply.
# Vulnerabilities are still denied across the whole tree.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "OFL-1.1",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "Unlicense", # ksni (via Slint), public-domain dedication
  # Slint is tri-licensed (GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR
  # LicenseRef-Slint-Software-3.0). ray-task uses the royalty-free license for
  # desktop apps, which requires the "Made with Slint" attribution in README.md.
  "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # workspace path deps; crates are publish = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
